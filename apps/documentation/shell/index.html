<!doctype html>
<html lang="en" data-color-scheme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swiss Post Design System</title>
    <meta
      name="description"
      content="The Swiss Post Design System pattern library for a unified and accessible user experience across the web platform."
    />

    <!-- Open Graph general (Facebook, Pinterest & Google+) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Swiss Post Design System" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:description"
      content="The Swiss Post Design System pattern library for a unified and accessible user experience across the web platform."
    />
    <meta property="og:url" content="https://design-system.post.ch" />
    <meta
      property="og:image"
      content="https://design-system.post.ch/images/design-system-preview.png"
    />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:alt" content="Swisspost Design Systems display image" />

    <meta property="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="stylesheet" href="/styles/post-default.css" />
    <meta name="design-system-settings" data-post-icon-base="/post-icons" />

    <script type="module" src="/src/main.ts"></script>
