<div class="my-24">
  <h2>Autocomplete</h2>
  <post-autocomplete
    filter-threshold="3"
    (postFilteringEvent)="log($event.detail)"
    textAvailableSuggestions="{count} suggestions available"
  >
    <div class="form-floating">
      <input
        type="text"
        id="autocomplete-country"
        class="form-control"
        placeholder="Search for a country"
      />
      <label for="autocomplete-country">Country</label>
    </div>
    <post-listbox>
      <post-listbox-option value="Switzerland" />
      <post-listbox-option value="Germany" />
      <post-listbox-option value="France" />
      <post-listbox-option value="Italy" selected="" />
    </post-listbox>
  </post-autocomplete>

  <hr />
  Value: {{ formControl.value }}
</div>
