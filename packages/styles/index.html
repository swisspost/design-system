<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Styles playground</title>

    <!-- Styles -->
    <link rel="stylesheet" id="styles" href="src/post-default.scss" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@swisspost/design-system-components/dist/post-components/post-components.css"
    />

    <script src="playground.js" defer></script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@swisspost/design-system-components/dist/esm/post-components.js"
    ></script>
  </head>
  <body data-color-scheme="light">
    <aside class="palette palette-brand p-16">
      <h1>Styles package playground</h1>
      <fieldset id="token-selects" class="mt-16">
        <legend class="my-8">Select tokens</legend>
        <label for="theme-select">Theme</label>
        <select name="theme" id="theme-select" value="post" class="mb-4 me-8">
          <option value="post">Post</option>
          <option value="cargo">Cargo</option>
        </select>
        <label for="appearance-select">Appearance</label>
        <select name="appearance" id="appearance-select" value="default" class="mb-4 me-8">
          <option value="default">Default</option>
          <option value="compact">Compact</option>
        </select>
        <label for="scheme-select">Color scheme</label>
        <select name="scheme" id="scheme-select" value="light" class="mb-4">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="">Unset</option>
        </select>
      </fieldset>
    </aside>

    <main class="p-16">
      <div style="max-width: 400px; white-space: nowrap">
        <button class="btn btn-primary" style="max-width: 200px">
          <post-icon aria-hidden="true" name="search"></post-icon>
          dasisteinsehrlangeswortdashierendet
        </button>
        <button class="btn btn-primary" style="max-width: 200px">
          <post-icon aria-hidden="true" name="search"></post-icon>
          dieser text ist zu lange
        </button>

        <button class="btn btn-primary" style="max-width: 200px">
          <post-icon aria-hidden="true" name="search"></post-icon>
          button
        </button>
      </div>

      <div style="max-width: 600px; white-space: nowrap; margin-top: 20px">
        <button class="btn btn-primary" style="max-width: 300px">
          <post-icon aria-hidden="true" name="search"></post-icon>
          dasisteinsehrlangeswortdashierimmernochnichtendet
        </button>
        <button class="btn btn-primary" style="max-width: 300px">
          <post-icon aria-hidden="true" name="search"></post-icon>
          dieser text ist viel zu lange
        </button>

        <button class="btn btn-primary" style="max-width: 300px">
          <post-icon aria-hidden="true" name="search"></post-icon>
          button
        </button>
      </div>
    </main>
  </body>
</html>
