<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KLP login widget (legacy) harness</title>
  <!--
    The legacy file starts with `const vertx = window.vertx || {}`, so seeding the global here
    hands the suite a reference to the Vert.x shim it then attaches EventBus to. The widget only
    ever uses registerHandler; the rest of the shim is only reachable this way.
  -->
  <script>window.vertx = {};</script>
  <script type="module" src="/build/klp-login-widget-legacy.esm.js"></script>
  <script nomodule src="/build/klp-login-widget-legacy.js"></script>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    .playground {
      min-height: 70vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .playground__panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      text-align: center;
    }

    .playground__hint {
      margin: 0;
      max-width: 44ch;
      color: #555;
    }

    .playground button {
      font: inherit;
      padding: 0.625rem 1.25rem;
      border: 1px solid #1a1a1a;
      border-radius: 2rem;
      background: #ffcc00;
      cursor: pointer;
    }

    .playground button.secondary {
      background: #fff;
    }
  </style>
</head>

<body>
  <!-- Light-DOM <header> so the legacy MutationObserver on h-fixed-position/h-visible has a target. -->
  <header>
    <swisspost-internet-header id="header"></swisspost-internet-header>
  </header>

  <main class="playground">
    <div class="playground__panel" id="playground"></div>
  </main>

  <script>
    // The Playwright suite drives the widget by setting ?config=<base64 json>&environment=...
    const params = new URLSearchParams(location.search);
    const header = document.getElementById('header');

    // Dev-only "pretend to log in": `?login` (optionally `?login=b2b`) answers the platform
    // subscribe call with a fake `sub` session, since a real one can never reach a localhost
    // origin. Everything else falls through to the network untouched.
    if (params.has('login')) {
      const session =
        params.get('login') === 'b2b'
          ? { name: 'Bea', surname: 'Muster', email: 'bea.muster@post.ch', userType: 'B2B', authLevel: 'PASSWORD', support: false, company: 'Post AG', canChangeCompany: true, changeUserAndProfile: null }
          : { name: 'Bea', surname: 'Muster', email: 'bea.muster@post.ch', userType: 'B2C', authLevel: 'PASSWORD', support: false };
      const realFetch = window.fetch.bind(window);
      window.fetch = (url, init) => {
        if (String(url).includes('/v1/session/subscribe')) {
          return Promise.resolve(
            new Response(JSON.stringify({ typ: 'sub', adr: 'dev-fake-address', ttl: 600000, data: session }), {
              status: 200,
              headers: { 'Content-Type': 'application/json' },
            }),
          );
        }
        return realFetch(url, init);
      };
    }

    // The v9 internet-header test-configuration.json `loginWidgetOptions`, repointed from prod
    // post.ch/n.post.ch to int so the demo never talks to production. Used only when `start` is
    // opened without an explicit ?config; the e2e suite always passes its own.
    const defaultConfig = {
      applicationId: 'kvm',
      serviceId: 'kvm',
      appLoginUrl: 'https://int.post.ch/idp/?login&lang=de&service=kvm',
      currentLang: 'de',
      options: {
        isDebugEnabled: false,
        logoutTargetURL: 'https://int.post.ch/de/',
      },
      platform: {
        endPoint: 'https://int-n.post.ch',
        notificationsEndPoint: 'https://int.post.ch/selfadmin/messages/unreadmessages',
        logoutURL: 'https://int.post.ch/logout/',
        keepAliveURL: 'https://int.post.ch/keepalive',
        autoLoginURL: 'https://int.post.ch/idp/?app=loginwidget',
      },
    };

    if (params.has('config')) {
      header.setAttribute('config', atob(params.get('config')));
    } else {
      header.setAttribute('config', JSON.stringify(defaultConfig));
    }
    if (params.has('environment')) {
      header.setAttribute('environment', params.get('environment'));
    }
    if (params.has('showJobsLoginWidget')) {
      header.setAttribute('show-jobs-login-widget', '');
    }
    if (params.has('logoutUrl')) {
      header.setAttribute('logout-url', params.get('logoutUrl'));
    }
    if (params.has('selfAdminOrigin')) {
      header.setAttribute('self-admin-origin', params.get('selfAdminOrigin'));
    }

    window.__widgetReadyCount = 0;
    document.addEventListener('wepploginwidget_widget_ready', () => {
      window.__widgetReadyCount++;
    });

    // A localhost origin can never receive a real platform session, so "logging in" means
    // reloading with `?login`, which fakes only the subscribe response above and then lets the
    // widget run its genuine subscribe -> `sub` -> login path, exactly as it does in production.
    const panel = document.getElementById('playground');
    if (params.has('login')) {
      const kind = params.get('login') === 'b2b' ? 'business customer (B2B)' : 'private customer (B2C)';
      const hint = document.createElement('p');
      hint.className = 'playground__hint';
      hint.textContent =
        'Pretending a ' + kind + ' session. Open the avatar at the top right to see the menu.';
      const logout = document.createElement('button');
      logout.className = 'secondary';
      logout.textContent = 'Log out';
      logout.addEventListener('click', () => (location.search = ''));
      panel.append(hint, logout);
    } else {
      const hint = document.createElement('p');
      hint.className = 'playground__hint';
      hint.textContent =
        'No real login is possible on localhost. These buttons fake the platform subscribe ' +
        'response so the widget runs its genuine login path.';
      const b2c = document.createElement('button');
      b2c.textContent = 'Pretend login (private customer)';
      b2c.addEventListener('click', () => (location.search = '?login'));
      const b2b = document.createElement('button');
      b2b.className = 'secondary';
      b2b.textContent = 'Pretend login (business customer)';
      b2b.addEventListener('click', () => (location.search = '?login=b2b'));
      panel.append(hint, b2c, b2b);
    }
  </script>
</body>

</html>
