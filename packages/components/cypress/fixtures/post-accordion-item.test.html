<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accordion item test fixture</title>
    <script src="../../dist/post-components/post-components.esm.js" type="module"></script>
    <style>
      post-accordion-item {
        display: block;
        position: relative;
        width: 20rem;
      }
    </style>
  </head>
  <body>
    <post-accordion-item>
      <span slot="header">Accordion item</span>
      <p>Content closed by the close button.</p>
      <post-closebutton>Close</post-closebutton>
    </post-accordion-item>

    <post-accordion id="findable-accordion" heading-level="2" findable>
      <post-accordion-item id="first-findable-item" collapsed>
        <span slot="header">First findable panel</span>
        <p id="first-accordion-target">First findable panel content</p>
      </post-accordion-item>
      <post-accordion-item id="second-findable-item" collapsed>
        <span slot="header">Second findable panel</span>
        <p id="second-accordion-target">Second findable panel content</p>
      </post-accordion-item>
      <post-accordion-item collapsed>
        <span slot="header">Nested accordion</span>
        <post-accordion id="nested-accordion" heading-level="3">
          <post-accordion-item id="nested-accordion-item" collapsed>
            <span slot="header">Non-findable nested panel</span>
            <p>Nested content</p>
          </post-accordion-item>
        </post-accordion>
      </post-accordion-item>
    </post-accordion>
  </body>
</html>
