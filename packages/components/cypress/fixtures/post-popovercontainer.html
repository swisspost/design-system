<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="../../node_modules/@swisspost/design-system-styles/post-default.css"
      rel="stylesheet"
    />
    <script src="../../dist/post-components/post-components.esm.js" type="module"></script>
    <style>
      .popover-body {
        width: 128px;
        height: 256px;
      }

      .spacer {
        height: 100vh;
      }

      .scrollable {
        height: 50vh;
        overflow-y: scroll;
      }

      dialog {
        /* Move the dialog to the top of the viewport, so that it overlaps the header. */
        margin: 0;
      }
    </style>
  </head>
  <body>
    <post-header text-menu="Menu">
      <post-logo slot="post-logo" url="/">Homepage</post-logo>

      <div slot="global-nav-primary">
        <post-popover-trigger id="popover-header-trigger">
          <button type="button" class="btn btn-secondary">Popover Trigger</button>
          <post-popover text-close="Close" id="popover-header">
            <div class="popover-body" id="popover-header-content"></div>
          </post-popover>
        </post-popover-trigger>
      </div>
    </post-header>

    <main>
      <div class="spacer"></div>

      <post-popover-trigger id="popover-page-trigger">
        <button type="button" class="btn btn-secondary">Popover Trigger</button>
        <post-popover text-close="Close" id="popover-page">
          <div class="popover-body" id="popover-page-content"></div>
        </post-popover>
      </post-popover-trigger>

      <div class="spacer"></div>

      <div class="scrollable" id="page-scrollable">
        <div class="spacer"></div>

        <post-popover-trigger id="popover-scrollable-trigger">
          <button type="button" class="btn btn-secondary">Popover Trigger</button>
          <post-popover text-close="Close" id="popover-scrollable">
            <div class="popover-body" id="popover-scrollable-content"></div>
          </post-popover>
        </post-popover-trigger>

        <div class="spacer"></div>
      </div>

      <div class="spacer"></div>
    </main>

    <dialog id="dialog" data-animation="none">
      <form method="dialog" class="dialog-grid">
        <div class="dialog-body" id="dialog-scrollable">
          <div class="spacer"></div>

          <post-popover-trigger id="popover-dialog-trigger">
            <button type="button" class="btn btn-secondary">Popover Trigger</button>
            <post-popover text-close="Close" id="popover-dialog">
              <div class="popover-body" id="popover-dialog-content"></div>
            </post-popover>
          </post-popover-trigger>

          <div class="spacer"></div>
        </div>
      </form>
    </dialog>
  </body>
</html>
