<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="../../node_modules/@swisspost/design-system-styles/post-default.css"
      rel="stylesheet"
    />
    <script src="../../dist/post-components/post-components.esm.js" type="module"></script>
    <style>
      .content {
        width: 128px;
        height: 256px;
      }

      .full-width {
        width: 100%;
      }

      .full-height {
        height: calc(100% - var(--post-header-height));
      }

      .spacer {
        height: 100vh;
      }

      post-popover-trigger > .btn {
        position: absolute;
      }
    </style>
  </head>
  <body>
    <post-header text-menu="Menu">
      <post-logo slot="post-logo" url="/">Homepage</post-logo>
    </post-header>

    <main>
      <div class="spacer"></div>

      <post-popover-trigger id="popover-placement-trigger">
        <button type="button" class="btn btn-secondary">Popover Trigger</button>
        <post-popover text-close="Close" id="popover-placement">
          <div class="content" id="popover-placement-content"></div>
        </post-popover>
      </post-popover-trigger>

      <post-popover-trigger id="popover-placement-full-width-trigger">
        <button type="button" class="btn btn-secondary full-width">Popover Trigger</button>
        <post-popover text-close="Close" id="popover-placement-full-width">
          <div class="content" id="popover-placement-full-width-content"></div>
        </post-popover>
      </post-popover-trigger>

      <post-popover-trigger id="popover-placement-full-height-trigger">
        <button type="button" class="btn btn-secondary full-height">Popover Trigger</button>
        <post-popover text-close="Close" id="popover-placement-full-height">
          <div class="content" id="popover-placement-full-height-content"></div>
        </post-popover>
      </post-popover-trigger>
    </main>
  </body>
</html>
