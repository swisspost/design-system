packages:
  - 'apps/*'
  - 'packages/*'

catalog:
  '@playwright/test': 1.60.0

catalogs:
  cypress:
    'cypress': 15.20.1
    'cypress-each': 1.14.1
    'cypress-axe': 1.7.0
    'cypress-storybook': 1.0.0
  node:
    '@types/node': 24.0.0
    'ts-node': 10.9.2
  jest:
    '@types/jest': 30.0.0
    'jest': 30.3.0
    'ts-jest': 29.4.9
  stencil/jest:
    '@types/jest': 29.5.14
    'jest': 29.7.0
    'jest-cli': 29.7.0
    'ts-jest': 29.4.9
  'typescript':
    'typescript': 6.0.3
    'typescript-eslint': 8.62.0
  angular:
    '@angular/build': 22.1.6
    '@angular/cli': 22.1.6
    '@angular/common': 22.1.4
    '@angular/compiler': 22.1.4
    '@angular/compiler-cli': 22.1.4
    '@angular/core': 22.1.4
    '@angular/forms': 22.1.4
    '@angular/platform-browser': 22.1.4
    '@angular/router': 22.1.4
    'angular-eslint': 22.2.0
    'ng-packagr': 22.1.1
    'rxjs': 7.8.2
    'tslib': 2.8.1
    'zone.js': 0.16.2
peerDependencyRules:
  ignoreMissing: []
  allowedVersions:
    '@typescript-eslint/eslint-plugin': '>=7'
    '@typescript-eslint/parser': '>=7'
    zone.js: '>=0.14'
overrides:
  browserslist: '>=4.27.0'
  form-data@>=4.0.0 <4.0.4: 4.0.6
strictPeerDependencies: false
saveExact: true
allowBuilds:
  '@parcel/watcher': true
  '@percy/core': true
  core-js-pure: true
  cypress: true
  es5-ext: true
  esbuild: true
  iframe-resizer: true
  lmdb: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
