###
#
# Run snapshot tests with percy
#
# This workflow only runs when triggered manually
#
###

name: Run snapshot tests
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0

      # Use cache is set to false because the cypress binary could not be cached correctly
      - name: Setup
        uses: ./.github/actions/setup-pnpm
        with:
          use_cache: false

      - name: Get tool binary cache keys
        id: tool-binary-cache
        uses: ./.github/actions/tool-binary-cache

      # Restore only: the cache is saved from main by the "Cache tool binaries" workflow
      - name: Restore Cypress binary
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.tool-binary-cache.outputs.cypress-path }}
          key: ${{ steps.tool-binary-cache.outputs.cypress-key }}

      - name: Bootstrap
        run: pnpm bootstrap

      # Takes full snapshots on the main and partial snapshots (using the filter) on every other branch
      - name: Take snapshots
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
        run: |
          pnpm snapshots
