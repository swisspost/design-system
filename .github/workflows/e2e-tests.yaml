###
#
# Runs the Cypress end to end tests of the packages changed since the base branch
#
# The suites run in parallel on separate runners, large suites are split into shards and
# small ones share a runner.
# The matrix is defined in .github/scripts/e2e-matrix.mjs
#
###

name: End to end tests

on:
  pull_request:
    paths:
      - 'apps/documentation/**'
      - 'packages/styles/**'
      - 'packages/components/**'
      - 'packages/internet-header/**'
      - 'packages/icons/**'
      - 'packages/tokens/tokensstudio-generated/tokens.json'
      - 'tooling/**'
      - '.github/workflows/e2e-tests.yaml'
      - '.github/scripts/e2e-matrix.mjs'
      - '.github/scripts/e2e-run.sh'
      - '.github/actions/setup-pnpm/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the runs of the previous push
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has-suites: ${{ steps.matrix.outputs.has-suites }}

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      # The pull request is checked out as its merge commit with the base branch, so comparing
      # it with the tip of the base branch gives the changes of the pull request alone.
      # A diff between two trees does not need the git history in between.
      - name: Fetch base branch
        env:
          BASE_BRANCH: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"

      - name: Setup
        uses: ./.github/actions/setup-pnpm
        with:
          use_cache: false

      - name: Create matrix
        id: matrix
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
          RUN_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: node .github/scripts/e2e-matrix.mjs

  test:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.has-suites == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Setup
        uses: ./.github/actions/setup-pnpm

      - name: Get tool binary cache keys
        id: tool-binary-cache
        uses: ./.github/actions/tool-binary-cache

      # Restore only: the cache is saved from main by the "Cache tool binaries" workflow
      - name: Restore Cypress binary
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.tool-binary-cache.outputs.cypress-path }}
          key: ${{ steps.tool-binary-cache.outputs.cypress-key }}

      - name: Install dependencies
        run: pnpm install

      # With a restored pnpm store the postinstall script of cypress can be skipped,
      # this makes sure the binary is there. It does nothing if it is already installed.
      - name: Install cypress binary
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          for PACKAGE in $PACKAGES; do
            pnpm --filter "$PACKAGE" exec cypress install
          done

      # The tests run against the storybook dev server, which only needs its dependencies built.
      - name: Build dependencies
        run: pnpm --filter "@swisspost/design-system-documentation^..." build

      - name: Cypress info
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          for PACKAGE in $PACKAGES; do
            pnpm --filter "$PACKAGE" exec cypress info
          done

      - name: Run tests
        env:
          PACKAGES: ${{ matrix.packages }}
          SPECS: ${{ matrix.specs }}
        run: pnpm exec start-server-and-test 'pnpm docs:headless' 9001 'bash .github/scripts/e2e-run.sh'

      - name: Upload screenshots
        uses: actions/upload-artifact@6027e3dd177782cd8ab9af838c04fd81a07f1d47
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.id }}
          path: ${{ matrix.screenshots }}
          retention-days: 14
          if-no-files-found: ignore

  # Single status for the whole workflow, keeps the name of the check used before the split.
  e2e:
    name: e2e
    needs: [plan, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          PLAN: ${{ needs.plan.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "plan: $PLAN, test: $TEST"
          if [[ "$PLAN" != "success" ]]; then
            exit 1
          fi
          # The test job is skipped when no suite is affected by the changes
          if [[ "$TEST" != "success" && "$TEST" != "skipped" ]]; then
            exit 1
          fi