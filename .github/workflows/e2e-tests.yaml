name: End to end tests
on:
  pull_request:
    paths:
      - 'apps/documentation/**'
      - 'packages/styles/**'
      - 'packages/components/**'
      - 'packages/internet-header/**'
      - 'packages/icons/**'
      - 'packages/tokens/tokensstudio-generated/tokens.json'
      - 'tooling/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup-pnpm
        with:
          use_cache: false

      - name: Get tool binary cache keys
        id: tool-binary-cache
        uses: ./.github/actions/tool-binary-cache

      # Restore only: the cache is saved from main by the "Cache tool binaries" workflow
      - name: Restore Cypress binary
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.tool-binary-cache.outputs.cypress-path }}
          key: ${{ steps.tool-binary-cache.outputs.cypress-key }}

      - name: Install & build dependencies
        run: pnpm install && pnpm -r build

      - name: Prepare Cypress – Spawn Xvfb server
        run: Xvfb :99 &

      - name: Prepare Cypress – Share Xvfb server as environment variable
        run: export DISPLAY=:99

      - name: Cypress info
        run: pnpm --filter design-system-documentation exec cypress info

      - name: Run tests
        run: pnpm e2e:ci

      - name: Upload screenshots
        uses: actions/upload-artifact@6027e3dd177782cd8ab9af838c04fd81a07f1d47
        if: failure()
        with:
          name: cypress-snapshots
          path: packages/**/cypress/screenshots
          retention-days: 14
