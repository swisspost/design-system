###
#
# Keeps a single pnpm store cache and a single CodeQL overlay base database cache per branch.
#
# Both caches are only saved from `main` and `release/*` (pnpm: see the setup-pnpm action, CodeQL: see the codeql workflow),
# but every save creates a new cache entry, as the cache keys contain a commit sha or run id. This workflow deletes
# - all but the newest `pnpm-cache-*` entry of `main` and of each `release/*` branch
# - all but the newest `codeql-overlay-base-database-*` entry per language of `main` and of each `release/*` branch
# - all of these entries of any other ref (e.g. pull requests), as they cannot be shared anyway
#
###

name: Prune pnpm cache
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches:
      - main
      - release/v*
  schedule:
    - cron: '30 5 * * *' # the job will run every day at 5:30 UTC
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  prune:
    runs-on: ubuntu-latest

    steps:
      - name: Delete outdated caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 1. List all pnpm and CodeQL overlay caches (id, ref, creation date, key) of the repository
          : > caches.tsv
          for key_prefix in pnpm-cache- codeql-overlay-base-database-; do
            gh api --paginate "repos/${GH_REPO}/actions/caches?key=${key_prefix}&per_page=100" \
              --jq '.actions_caches[] | [.id, .ref, .created_at, .key] | @tsv' >> caches.tsv
          done

          # 2. Select the caches to delete. Sorted newest first, so the first entry per ref and cache type is the one to keep:
          #    main and release/* keep their newest cache (per language for CodeQL), all other refs keep none.
          #    CodeQL key: codeql-overlay-base-database-<version>-<hash>-<language>-<codeql version>-<sha>-<run id>-<attempt>
          sort -t$'\t' -k3,3r caches.tsv | awk -F'\t' '
            {
              type = "pnpm"
              if ($4 ~ /^codeql-overlay-base-database-/) { split($4, parts, "-"); type = "codeql-" parts[7] }
            }
            $2 == "refs/heads/main" || $2 ~ /^refs\/heads\/release\// { if (seen[$2 SUBSEP type]++) print $1; next }
            { print $1 }
          ' > delete-ids.txt

          # 3. Retry settings: one initial round plus up to $max_retries retry rounds
          total=$(wc -l < delete-ids.txt)
          max_retries=2

          # 4. A failed deletion must not stop the job: failed ids are collected and retried in the next round
          for round in $(seq 0 "$max_retries"); do
            # stop early when nothing is left to delete
            [ -s delete-ids.txt ] || break

            # back off a little longer before each retry round
            if [ "$round" -gt 0 ]; then
              echo "Retry round $round of $max_retries for $(wc -l < delete-ids.txt) failed deletion(s)"
              sleep $((round * 5))
            fi

            # delete each cache; on failure log a warning and remember the id for the next round
            : > failed-ids.txt
            while read -r id; do
              echo "Deleting cache $id"
              if ! gh api --method DELETE "repos/${GH_REPO}/actions/caches/$id" > /dev/null; then
                echo "::warning::Failed to delete cache $id (round $round)"
                echo "$id" >> failed-ids.txt
              fi
            done < delete-ids.txt

            # only the failed ids are attempted again in the next round
            mv failed-ids.txt delete-ids.txt
          done

          # 5. Report caches that still could not be deleted after all attempts
          failed=$(wc -l < delete-ids.txt)
          while read -r id; do
            echo "::error::Giving up on cache $id after $((max_retries + 1)) attempts"
          done < delete-ids.txt

          # 6. Summary; fail the job if any cache could not be deleted
          echo "Deleted $((total - failed)) of $(wc -l < caches.tsv) cache entries ($failed failed)"
          [ "$failed" -eq 0 ] || exit 1
