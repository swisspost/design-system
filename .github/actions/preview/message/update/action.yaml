name: Update preview message
description: Add a preview url to the existing preview comment, if not already present

inputs:
  access-token:
    description: The access token to use for commenting.
    required: true
  issue-number:
    description: The issue number from the caller workflow.
    required: true
  preview-url:
    description: The preview url to add in the comment.
    required: true
  snapshot-story-ids:
    description: Comma separated storybook snapshot story ids of the components changed in the pull request.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      env:
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        PREVIEW_URL: ${{ inputs.preview-url }}
        SNAPSHOT_STORY_IDS: ${{ inputs.snapshot-story-ids }}
      with:
        github-token: ${{ inputs.access-token }}
        script: |
          const { ISSUE_NUMBER, PREVIEW_URL, SNAPSHOT_STORY_IDS } = process.env

          const commentTitle = '**Related Previews**'
          const commentInitialBody = 'Preview URLs will be added here, once they are ready... ![loader](https://github.com/swisspost/design-system/assets/9716662/49a75898-7093-4ffb-9460-071ff194459d)'

          const comments = (await github.rest.issues.listComments({
            repo: context.repo.repo,
            owner: context.repo.owner,
            issue_number: Number(ISSUE_NUMBER)
          })).data || []

          const previewComment = comments.find(c => c.user.login === 'swisspost-bot' && c.body.includes(commentTitle))
          const iconsUpdateTitle = 'chore(icons): :point_up: update icons'

          // Rebuilt on every run, because the components touched by the pull request change with every push.
          const snapshotLinks = (SNAPSHOT_STORY_IDS || '').split(',').filter(Boolean).map(storyId => {
            const snapshotURL = URL.parse(PREVIEW_URL)
            snapshotURL.searchParams.set('path', `/story/${encodeURIComponent(storyId)}`)
            return `- Snapshots \`${storyId.replace('snapshots--', '')}\`: ${snapshotURL.toString()}\n`
          })
          const snapshotSection = snapshotLinks.length ? `<!-- snapshots -->\n${snapshotLinks.join('')}<!-- /snapshots -->\n` : ''
          const snapshotSectionPattern = /<!-- snapshots -->[\s\S]*?<!-- \/snapshots -->\n?/

          if (previewComment) {
            let updates = [];

            const issue = await github.rest.issues.get({
              repo: context.repo.repo,
              owner: context.repo.owner,
              issue_number: Number(ISSUE_NUMBER),
            });

            if (issue?.data?.title.includes(iconsUpdateTitle)) {
              const iconHealthURL = URL.parse(PREVIEW_URL)
              iconHealthURL.searchParams.set('path', '/docs/health-icons--docs')
              updates.push(`- ${iconHealthURL.toString()}\n`)
            }

            const body = previewComment.body
              .replace(commentInitialBody, '')
              .replace(snapshotSectionPattern, '')
              .concat(previewComment.body.includes(PREVIEW_URL) ? '' : `- ${PREVIEW_URL}\n`)
              .concat(updates.filter(update => !previewComment.body.includes(update)).join(''))
              .concat(snapshotSection)

            if (body === previewComment.body) return

            await github.rest.issues.updateComment({
              repo: context.repo.repo,
              owner: context.repo.owner,
              comment_id: previewComment.id,
              body
            });

            const reactions = (await github.rest.reactions.listForIssueComment({
              repo: context.repo.repo,
              owner: context.repo.owner,
              comment_id: previewComment.id,
            })).data || []

            const createReaction = reactions.find(r => r.user.login === 'swisspost-bot' && r.content === 'eyes')
            const updateReaction = reactions.find(r => r.user.login === 'swisspost-bot' && r.content === 'rocket')

            if (createReaction) {
              github.rest.reactions.deleteForIssueComment({
                repo: context.repo.repo,
                owner: context.repo.owner,
                comment_id: previewComment.id,
                reaction_id: createReaction.id
              })
            }

            if (!updateReaction) {
              github.rest.reactions.createForIssueComment({
                repo: context.repo.repo,
                owner: context.repo.owner,
                comment_id: previewComment.id,
                content: 'rocket'
              })
            }
          } else {
            console.warn('Skipped action, because preview comment could not be found!')
          }
