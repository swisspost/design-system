###
#
# https://docs.github.com/en/actions/creating-actions/about-custom-actions#using-release-management-for-actions
#
###

name: Artifact Download
description: Downloads an artifact to a specific folder.

inputs:
  name:
    description: Name of the artifact
    required: true
    type: string
  folder:
    description: Path to the folder where to download to
    required: true
    type: string

outputs:
  id:
    description: The build id from the artifact uploading workflow.
    value: ${{ steps.build.outputs.id }}
  action:
    description: The build action from the artifact uploading workflow.
    value: ${{ steps.build.outputs.action }}
  folder:
    description: Path to the folder where to download to
    value: ${{ inputs.folder }}

runs:
  using: composite
  steps:
    - name: Create temporary directory
      shell: bash
      run: mkdir -p ${{ runner.temp }}/artifact_download

    - name: Download artifact
      uses: dawidd6/action-download-artifact@23e7b2e9aa32a408a649c4fca36dee127ff5d325
      with:
        name: ${{ inputs.name }}
        run_id: ${{ github.event.workflow_run.id }}
        workflow_conclusion: success
        path: ${{ runner.temp }}/artifact_download

    - name: Ensure target directory exists
      env:
        FOLDER: ${{ inputs.folder }}
      shell: bash
      run: mkdir -p $FOLDER

    - name: Unzip artifacts
      env:
        FOLDER: ${{ inputs.folder }}
      shell: bash
      run: unzip ${{ runner.temp }}/artifact_download/artifacts.zip -d $FOLDER

    - name: Remove symlinks from the extracted artifact
      env:
        FOLDER: ${{ inputs.folder }}
      shell: bash
      run: |
        # The artifact is produced by an untrusted (fork) workflow. A symlink in
        # the archive could point at a secret file on the runner (e.g. the token
        # written to .git/config) and leak it when the folder is later deployed.
        # Strip every symlink before the content is used.
        LINKS=$(find "$FOLDER" -type l)
        if [[ -n "$LINKS" ]]; then
          echo "Warning: removing symlinks found in the artifact:"
          echo "$LINKS"
          find "$FOLDER" -type l -delete
        fi

    - name: Validate artifact contents
      env:
        FOLDER: ${{ inputs.folder }}
      shell: bash
      run: |
        if [[ ! -f "$FOLDER/GHA-EVENT-ID" ]]; then
          echo "Error: Event ID file missing"
          exit 1
        fi

        if [[ ! -f "$FOLDER/GHA-EVENT-ACTION" ]]; then
          echo "Error: Event Action file missing"
          exit 1
        fi

        # Validate ID is numeric
        EVENT_ID=$(cat $FOLDER/GHA-EVENT-ID)
        if ! [[ "$EVENT_ID" =~ ^[0-9]*$ ]]; then
          echo "Error: Invalid Event ID format"
          exit 1
        fi

    - name: Verify pull request number
      if: ${{ github.event_name == 'workflow_run' }}
      env:
        FOLDER: ${{ inputs.folder }}
        GH_TOKEN: ${{ github.token }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        REPO: ${{ github.repository }}
      shell: bash
      run: |
        # The PR number is stored inside the untrusted artifact, so a fork could
        # claim a different (victim) PR and make this privileged workflow comment
        # on or deploy to it. Cross-check the claimed number against the pull
        # request that actually owns the commit which triggered this run.
        CLAIMED_ID=$(cat "$FOLDER/GHA-EVENT-ID" | tr -cd '[:digit:]')

        REAL_IDS=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" --jq '.[].number' | tr -cd '0-9\n')

        if [[ -z "$REAL_IDS" ]]; then
          echo "Error: Could not resolve a pull request for commit ${HEAD_SHA}"
          exit 1
        fi

        if ! grep -qx "$CLAIMED_ID" <<< "$REAL_IDS"; then
          echo "Error: Artifact PR number ($CLAIMED_ID) does not match the triggering pull request(s): $(echo "$REAL_IDS" | tr '\n' ' ')"
          exit 1
        fi

    - name: Clean up
      shell: bash
      run: rm -rf ${{ runner.temp }}/artifact_download

    - name: Create outputs
      env:
        FOLDER: ${{ inputs.folder }}
      id: build
      shell: bash
      run: |
        EVENT_ID=$(cat $FOLDER/GHA-EVENT-ID)
        EVENT_ACTION=$(cat $FOLDER/GHA-EVENT-ACTION)

        SANITIZED_ID=$(echo "$EVENT_ID" | tr -cd '[:digit:]')
        SANITIZED_ACTION=$(echo "$EVENT_ACTION" | tr -cd '[:alnum:]-_')

        echo "id=$SANITIZED_ID" >> $GITHUB_OUTPUT
        echo "action=$SANITIZED_ACTION" >> $GITHUB_OUTPUT
